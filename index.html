<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dojo Quiz">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dojo Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#140726;
  --bg1:#3b1172; --bg2:#1b0838;
  --orange:#ff8a1f; --yellow:#ffd23f; --red:#ff4d5e; --blue:#2fa8ff; --green:#3ddc84; --pink:#ff5ec8;
  --paper:#fff8ec;
  --out: 3px solid var(--ink);
  --r: 18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#1b0838;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
button,.drop,.player,.subj{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{
  font-family:"Nunito",system-ui,sans-serif;font-weight:800;color:var(--ink);
  background:radial-gradient(circle at 50% 35%, #6a23c4 0%, var(--bg1) 35%, var(--bg2) 100%) fixed;
  overflow-x:hidden;
}
/* Fond « explosion manga » */
body::before{
  content:"";position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:.18;
  background:repeating-conic-gradient(from 0deg at 50% 50%, #fff 0deg 4deg, transparent 4deg 14deg);
  animation:spin 120s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,calc(env(safe-area-inset-bottom) + 12px)) max(16px,env(safe-area-inset-left))}
.screen{display:none;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.screen.on{display:block}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

h1,h2,.bang{font-family:"Bangers",Impact,"Arial Black",sans-serif;letter-spacing:1.5px;font-weight:400;margin:0}
.logo{
  font-size:64px;line-height:.9;text-align:center;color:var(--yellow);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:4px 5px 0 var(--ink), 0 0 30px rgba(255,210,63,.5);
  transform:rotate(-3deg);margin:6px 0 2px;
}
.logo span{color:var(--orange)}
.tag{text-align:center;color:#fff;opacity:.9;font-size:15px;margin-bottom:10px}
.title{
  font-size:40px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  text-shadow:3px 4px 0 var(--ink);text-align:center;margin:8px 0 14px;transform:rotate(-2deg)
}

.card{
  background:var(--paper);border:var(--out);border-radius:var(--r);
  box-shadow:0 6px 0 var(--ink);padding:16px;margin:14px 0;position:relative
}
.btn{
  font-family:"Bangers",Impact,"Arial Black",sans-serif;letter-spacing:1.5px;font-size:26px;
  display:block;width:100%;padding:14px 18px;border:var(--out);border-radius:16px;cursor:pointer;
  color:#fff;background:var(--orange);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;
  text-shadow:2px 2px 0 var(--ink);
  box-shadow:0 6px 0 var(--ink), inset 0 -6px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.35);
  transition:transform .08s, box-shadow .08s;margin:10px 0
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,.18)}
.btn:disabled{filter:grayscale(.8) brightness(.9);cursor:not-allowed}
.btn.yellow{background:var(--yellow);color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.pink{background:var(--pink)}
.btn.ghost{background:#fff;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;font-size:22px}
.btn.small{font-size:20px;padding:9px 12px}
.row{display:flex;gap:10px}.row>*{flex:1}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.iconbtn{
  width:48px;height:48px;border:var(--out);border-radius:14px;background:#fff;font-size:24px;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;flex:none
}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* Mascotte */
.mascot{display:block;margin:0 auto;width:150px;height:150px;animation:bob 2.4s ease-in-out infinite}
.mascot.small{width:90px;height:90px}
.mascot.duo{width:260px;height:174px}.mascot.duo.small{width:170px;height:114px}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.bubble{
  background:#fff;border:var(--out);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--ink);
  position:relative;text-align:center;margin:6px auto 0;max-width:340px;font-size:16px
}
.bubble::after{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--ink);border-top:0}

/* Joueurs */
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player{
  border:var(--out);border-radius:var(--r);padding:12px 8px 10px;text-align:center;cursor:pointer;
  box-shadow:0 6px 0 var(--ink);background:#fff;transition:transform .1s
}
.player:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.avatar{
  width:64px;height:64px;border-radius:50%;border:var(--out);margin:0 auto 6px;display:grid;place-items:center;
  font-family:"Bangers",Impact,sans-serif;font-size:34px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill
}
.pname{font-size:18px}
.belt{display:inline-block;margin-top:4px;padding:2px 10px;border:2px solid var(--ink);border-radius:99px;font-size:12px}
.player.add{background:rgba(255,255,255,.15);color:#fff;border-style:dashed;border-color:#fff;box-shadow:none;display:grid;place-items:center;min-height:140px;font-family:"Bangers",Impact,sans-serif;font-size:24px}

/* Matières */
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.subj{
  border:var(--out);border-radius:14px;background:#fff;padding:10px 4px;text-align:center;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);font-size:13px;transition:transform .1s
}
.subj .e{font-size:30px;display:block}
.subj.sel{background:var(--yellow);transform:translateY(-3px) rotate(-2deg);box-shadow:0 7px 0 var(--ink)}

.label{font-family:"Bangers",Impact,sans-serif;font-size:24px;letter-spacing:1px;margin:0 0 8px}
.label small{font-family:"Nunito";font-size:13px;opacity:.7;letter-spacing:0}

.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:3/4;border:var(--out);border-radius:10px;overflow:hidden;background:#ddd}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--red);color:#fff;font-weight:900;cursor:pointer;line-height:1;padding:0}
.thumb .n{position:absolute;left:4px;bottom:4px;background:var(--ink);color:#fff;border-radius:6px;font-size:12px;padding:0 6px}
.drop{
  border:3px dashed var(--ink);border-radius:14px;padding:16px;text-align:center;background:#fff3d6;cursor:pointer
}
.drop .e{font-size:40px;display:block}
.seg{display:flex;border:var(--out);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.seg button{flex:1;border:0;border-right:var(--out);background:#fff;font:inherit;font-size:18px;padding:10px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.sel{background:var(--blue);color:#fff}

/* Chargement */
.loader{text-align:center;color:#fff;padding-top:30px}
.spinner{width:120px;height:120px;margin:20px auto;position:relative}
.spinner svg{width:100%;height:100%;animation:spin 1s linear infinite}
.tip{min-height:48px;font-size:17px;padding:0 10px}

/* Quiz */
.hud{display:flex;align-items:center;gap:10px;color:#fff}
.bar{flex:1;height:22px;border:var(--out);border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .4s;border-right:3px solid var(--ink)}
.chip{background:#fff;border:var(--out);border-radius:12px;padding:4px 10px;font-size:15px;color:var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.combo{position:absolute;right:10px;bottom:-24px;z-index:2;pointer-events:none;
  font-family:"Bangers",Impact,sans-serif;font-size:30px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  text-shadow:3px 3px 0 var(--ink);text-align:right;transform:rotate(-4deg)
}
.combo.boom{animation:boom .5s}
@keyframes boom{0%{transform:scale(.4) rotate(-12deg)}60%{transform:scale(1.35) rotate(3deg)}100%{transform:scale(1) rotate(-4deg)}}
.qcard{font-size:clamp(19px,5.6vw,24px);line-height:1.3;min-height:92px;padding:30px 16px 16px;margin:18px 0 16px}
.qcard.long{font-size:clamp(17px,4.8vw,21px)}
.qnum{position:absolute;top:-16px;left:14px;background:var(--pink);color:#fff;border:var(--out);border-radius:10px;padding:0 10px;font-family:"Bangers",Impact,sans-serif;font-size:20px;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.kind{position:absolute;top:-14px;right:14px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 8px;font-size:12px}
.answers{display:grid;gap:12px}
.ans{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  border:var(--out);border-radius:16px;padding:10px 14px;min-height:60px;font:inherit;font-size:clamp(17px,4.7vw,20px);line-height:1.2;color:var(--ink);cursor:pointer;
  background:#fff;box-shadow:0 5px 0 var(--ink);transition:transform .08s
}
.ans:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ans .k{
  flex:none;width:40px;height:40px;border-radius:12px;border:var(--out);display:grid;place-items:center;
  font-family:"Bangers",Impact,sans-serif;font-size:24px;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill
}
.ans:nth-child(1) .k{background:var(--red)}.ans:nth-child(2) .k{background:var(--blue)}
.ans:nth-child(3) .k{background:var(--yellow)}.ans:nth-child(4) .k{background:var(--green)}
.ans.good{background:var(--green);animation:pulse .4s}
.ans.bad{background:var(--red);color:#fff;animation:shake .4s}
.ans.dim{opacity:.45}
.ans[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.04)}}
.feedback{display:none}
.feedback.on{display:block;position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:5;
  border-radius:22px 22px 0 0;border-bottom:0;box-shadow:0 -6px 0 var(--ink), 0 -20px 40px rgba(0,0,0,.35);
  padding:14px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 10px) max(16px,env(safe-area-inset-left));
  max-height:70dvh;overflow:auto;animation:sheet .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.feedback .btn{margin:10px 0 0}
#fb-text{font-size:clamp(16px,4.4vw,18px);line-height:1.35}
/* une fois répondu : on ne garde que la bonne réponse (et l'erreur éventuelle) */
.answered .ans.dim{display:none}
.answered .qcard{font-size:clamp(16px,4.4vw,19px);min-height:0}
.answered .ans{min-height:50px;padding:8px 12px}
.hud .iconbtn{width:44px;height:44px;font-size:20px}
.fb-head{font-family:"Bangers",Impact,sans-serif;font-size:30px;letter-spacing:1px;margin-bottom:4px}
.fb-head.ok{color:#169c55}.fb-head.ko{color:#d6283a}
.xp-fly{position:fixed;font-family:"Bangers",Impact,sans-serif;font-size:34px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;pointer-events:none;animation:fly 1s forwards;z-index:9}
@keyframes fly{to{transform:translateY(-90px);opacity:0}}

/* Résultats */
.stars{text-align:center;font-size:56px;letter-spacing:6px;filter:drop-shadow(3px 3px 0 var(--ink))}
.stars .off{filter:grayscale(1) brightness(.6);opacity:.6}
.stars span{display:inline-block;animation:pop .5s backwards}
.bigscore{font-family:"Bangers",Impact,sans-serif;font-size:60px;text-align:center;line-height:1}
.beltbox{display:flex;align-items:center;gap:12px}
.beltbar{flex:1;height:18px;border:var(--out);border-radius:99px;background:#eee;overflow:hidden}
.beltbar i{display:block;height:100%;background:var(--green)}
.miss{border-top:2px dashed #cbb;padding:10px 0}
.miss:first-child{border-top:0}
.miss .q{font-size:16px}.miss .a{color:#169c55;font-size:15px;margin-top:4px}.miss .x{font-size:14px;opacity:.8;margin-top:2px;font-weight:700}

/* Réglages */
input[type=text],input[type=password],input[type=url]{
  width:100%;font:inherit;font-size:17px;padding:12px;border:var(--out);border-radius:12px;background:#fff;margin:4px 0 10px
}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:6px 4px;border-bottom:1px solid #ddd;text-align:left;font-weight:700}
.hist th{font-weight:900}
.muted{opacity:.7;font-weight:700;font-size:14px}
.err{background:#ffe1e4;border:var(--out);border-radius:12px;padding:10px;margin-top:10px;display:none}
.err.on{display:block}
.center{text-align:center}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border:2px solid var(--ink);z-index:8;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:380px){.logo{font-size:52px}}
/* petits iPhone (SE, mini) : on resserre l'accueil */
@media (max-height:740px){
  .logo{font-size:46px}.mascot.duo{width:210px;height:140px}.mascot.duo.small{width:150px;height:100px}
  .title{font-size:32px;margin:4px 0 8px}.bubble{font-size:15px;padding:8px 12px}
  .bubble.shout{font-size:21px}.card{padding:12px;margin:10px 0}.btn{font-size:23px;padding:12px 16px}
  .ans{min-height:54px}
}
@media (prefers-reduced-motion:reduce){body::before,.mascot{animation:none}}

.drop.compact{padding:10px}.drop.compact .e{font-size:26px}.drop.compact .bang{font-size:20px!important}.drop.compact .muted{display:none}
.bubble.shout{font-family:"Bangers",Impact,sans-serif;font-size:26px;letter-spacing:1px;line-height:1.1;background:var(--yellow);transform:rotate(-2deg);animation:pop .5s .2s backwards}
/* ===== Danse de victoire ===== */
.mascot.duo.victory{width:310px;height:238px;max-width:100%;animation:none}
.victory g{transform-box:view-box}
.victory .r-all{animation:rAll 4s ease-in-out infinite}
.victory .r-arm-l{animation:rArmL 4s ease-in-out infinite}
.victory .r-arm-r{animation:rArmR 4s ease-in-out infinite}
.victory .r-leg-l{animation:rLegL 4s ease-in-out infinite}
.victory .r-leg-r{animation:rLegR 4s ease-in-out infinite}
.victory .g-all{animation:gAll 4s ease-in-out infinite}
.victory .g-arm-l{animation:gArmL 4s ease-in-out infinite}
.victory .g-arm-r{animation:gArmR 4s ease-in-out infinite}
.victory .g-leg-l{animation:gLegL 4s ease-in-out infinite}
.victory .g-leg-r{animation:gLegR 4s ease-in-out infinite}
.victory .spark{opacity:0;animation:spark 4s ease-out infinite}
.victory .spark.s2{animation-delay:1s}
.victory .kiai{opacity:0}
.victory .k1{animation:kiai1 4s ease-out infinite}
.victory .k2{animation:kiai2 4s ease-out infinite}
/* Rose : pas de danse K-pop, coup de pied, coup de poing, tour sur elle-même */
@keyframes rAll{0%,20%,40%,100%{transform:none}10%{transform:translateY(-10px) rotate(-6deg)}30%{transform:translateY(-10px) rotate(6deg)}
  45%{transform:translateX(-4px) rotate(8deg)}52%,58%{transform:translateX(-8px) rotate(-6deg)}66%{transform:translateY(-16px) scaleX(-1)}74%{transform:none}82%{transform:translateY(-8px)}90%{transform:none}}
@keyframes rArmL{0%,20%,40%,64%,90%,100%{transform:rotate(25deg)}10%,30%{transform:rotate(160deg)}52%,58%{transform:rotate(92deg)}80%{transform:rotate(165deg)}}
@keyframes rArmR{0%,64%,90%,100%{transform:rotate(-25deg)}10%,30%{transform:rotate(-45deg)}20%,40%{transform:rotate(-160deg)}52%,58%{transform:rotate(-125deg)}80%{transform:rotate(-165deg)}}
@keyframes rLegL{0%,38%,50%,100%{transform:none}45%{transform:rotate(80deg)}}
@keyframes rLegR{0%,20%,40%,100%{transform:none}10%,30%{transform:rotate(-12deg)}82%{transform:rotate(-15deg)}}
/* Gabin : garde, direct du droit, direct du gauche, coup de pied haut, saut */
@keyframes gAll{0%,22%,37%,56%,72%,86%,100%{transform:none}8%{transform:translateY(5px)}15%{transform:translateX(5px) rotate(5deg)}30%{transform:translateX(-5px) rotate(-5deg)}
  48%{transform:translateX(6px) rotate(-5deg)}66%{transform:translateY(-28px)}80%,92%{transform:translateY(-8px)}}
@keyframes gArmR{0%,22%,37%,56%,72%,86%,100%{transform:rotate(-25deg)}8%{transform:rotate(-60deg)}15%{transform:rotate(-95deg)}30%{transform:rotate(-55deg)}48%{transform:rotate(-150deg)}66%{transform:rotate(-170deg)}80%,92%{transform:rotate(-150deg)}}
@keyframes gArmL{0%,22%,37%,56%,72%,80%,92%,100%{transform:rotate(25deg)}8%{transform:rotate(60deg)}15%{transform:rotate(55deg)}30%{transform:rotate(95deg)}48%{transform:rotate(150deg)}66%{transform:rotate(170deg)}86%{transform:rotate(150deg)}}
@keyframes gLegR{0%,40%,56%,72%,100%{transform:none}48%{transform:rotate(-110deg)}66%{transform:rotate(-30deg)}}
@keyframes gLegL{0%,60%,72%,100%{transform:none}66%{transform:rotate(30deg)}}
@keyframes kiai1{0%,12%{opacity:0;transform:scale(.3)}16%{opacity:1;transform:scale(1.15)}24%{opacity:1;transform:scale(1)}28%,100%{opacity:0;transform:scale(1)}}
@keyframes kiai2{0%,45%{opacity:0;transform:scale(.3)}49%{opacity:1;transform:scale(1.15)}56%{opacity:1;transform:scale(1)}60%,100%{opacity:0}}
@keyframes spark{0%{opacity:0;transform:scale(.2)}8%{opacity:1;transform:scale(1.2)}20%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.victory g{animation:none!important}.victory .kiai,.victory .spark{opacity:0}}
@media (max-height:740px){.mascot.duo.victory{width:240px;height:200px}}

.subjchip{display:inline-block;background:var(--yellow);border:var(--out);border-radius:99px;padding:4px 14px;box-shadow:0 3px 0 var(--ink);font-size:16px}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ ACCUEIL = MISSION ============ -->
<section id="s-home" class="screen on">
  <div class="topbar">
    <span></span>

  </div>
  <div class="logo">DOJO <span>QUIZ</span></div>
  <div id="m-home"></div>
  <div class="bubble" id="home-bubble"></div>

  <div class="card">
    <label class="drop" id="drop">
      <span class="e">📸</span>
      <span class="bang" style="font-size:26px">PRENDS TA LEÇON EN PHOTO</span><br>
      <span class="muted">bien à plat, avec de la lumière, toute la page visible</span>
      <input type="file" id="file" accept="image/*" capture="environment" multiple hidden>
    </label>
    <div class="photos" id="photos"></div>
    <div class="muted center" id="photo-hint" style="margin-top:8px;display:none">Ta leçon continue sur une autre page ? Ajoute-la (4 pages max).</div>
  </div>

  <button class="btn" id="launch" onclick="launch()" disabled>LANCER LE DÉFI ! ⚡</button>
  <div class="err" id="home-err"></div>
  <div class="card" id="activate" style="display:none">
    <p class="label">Activer l'appli sur cet appareil</p>
    <p class="muted" style="margin:0 0 6px">À faire une seule fois, par un parent.</p>
    <input type="password" id="act-code" placeholder="Code d'activation" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn green small" onclick="activateFromField()">ACTIVER</button>
  </div>
  <button class="btn ghost small" id="replay-last" onclick="replayLast()" style="display:none">↻ Refaire le dernier défi</button>
  <button class="btn yellow small" id="try-demo" onclick="demo()" style="display:none">🎮 ESSAYER UN DÉFI D'EXEMPLE</button>
</section>

<!-- ============ CHARGEMENT ============ -->
<section id="s-loading" class="screen">
  <div class="loader">
    <h2 class="title">CONCENTRATION…</h2>
    <div id="m-load"></div>

  document.getElementById("try-demo").style.display = (cfg.url && cfg.code) ? "none" : "block";
}
function removePhoto(i){ photos.splice(i,1); renderHome(); }
document.getElementById("file").addEventListener("change", async e=>{
  const files = [...e.target.files].slice(0, 4-photos.length);
  for(const f of files){
    try{ photos.push(await compress(f)); }catch{ showErr("Impossible de lire cette photo. Essaie encore."); }
  }
  e.target.value = ""; renderHome();
});
/* Réduit la photo (1600 px max) pour un envoi rapide et moins coûteux */
function compress(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const max = 1600, s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const dataUrl = c.toDataURL("image/jpeg", .82);
      URL.revokeObjectURL(url);
      resolve({media_type:"image/jpeg", data:dataUrl.split(",")[1], preview:dataUrl});
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}

let tipTimer;
async function launch(){
  if(!cfg.url || !cfg.code){ showActivate(); return; }
  go("loading");
  document.getElementById("m-load").innerHTML = mascot("wow", true);
  let t=0; const tip=document.getElementById("tip"); tip.textContent=TIPS[0];
  tipTimer = setInterval(()=>{ t=(t+1)%TIPS.length; tip.textContent=TIPS[t]; }, 3500);
  try{
    const res = await fetch(cfg.url, {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Access-Code":cfg.code},
      body: JSON.stringify({count:QUESTION_COUNT, images:photos.map(p=>({media_type:p.media_type,data:p.data}))})
    });
    const data = await res.json().catch(()=>({error:"Réponse illisible du serveur."}));
    clearInterval(tipTimer);
    if(res.status===401){ goHome(); showErr("Code d'activation incorrect. Saisis-le à nouveau."); showActivate(); return; }
    if(!res.ok || data.error){ goHome(); showErr(data.error || "Erreur "+res.status); return; }
    if(!data.readable){ goHome(); showErr(data.problem); return; }
    lastQuiz = {title:data.title, summary:data.summary, subject:data.subject, questions:data.questions};
    store.set("last", lastQuiz);
    showIntro(lastQuiz);
  }catch(err){
    clearInterval(tipTimer); goHome();
    showErr("Pas de connexion au serveur. Vérifie Internet et réessaie.");
  }
}

function shuffleChoices(q){
  const idx=[0,1,2,3].sort(()=>Math.random()-.5);
  return {...q, choices:idx.map(i=>q.choices[i]), answer_index:idx.indexOf(q.answer_index)};
}
function startQuiz(qz, isRetry=false){
  quiz = {...qz, questions: qz.questions.map(shuffleChoices), isRetry};
  qi=0; score=0; combo=0; bestCombo=0; xpGain=0; mistakes=[];
  document.getElementById("xp-chip").textContent = "⚡ 0";
  go("quiz"); showQ();
}
function showQ(){
  const q = quiz.questions[qi];
  document.getElementById("progress").style.width = (qi/quiz.questions.length*100)+"%";
  document.getElementById("qnum").textContent = `Q${qi+1}/${quiz.questions.length}`;
  document.getElementById("qkind").textContent = q.kind==="memorisation" ? "🧠 Mémoire" : "💡 Réflexion";
  document.getElementById("qtext").textContent = q.question;
  document.querySelector(".qcard").classList.toggle("long", q.question.length>110);
  document.getElementById("s-quiz").classList.remove("answered");
  document.getElementById("s-quiz").style.paddingBottom = "0";
  window.scrollTo(0,0);
  document.getElementById("answers").innerHTML = q.choices.map((c,i)=>
    `<button class="ans" onclick="answer(${i},event)"><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`).join("");
  document.getElementById("feedback").classList.remove("on");
  const cb = document.getElementById("combo");
  cb.textContent = combo>=2 ? `COMBO ×${combo} 🔥` : ""; cb.classList.remove("boom");
}
function answer(i, ev){
  const q = quiz.questions[qi];
  const btns = [...document.querySelectorAll(".ans")];
  if(btns[0].disabled) return;
  btns.forEach(b=>b.disabled=true);
  const ok = i===q.answer_index;
  btns.forEach((b,j)=>{
    if(j===q.answer_index) b.classList.add("good");
    else if(j===i) b.classList.add("bad");
    else b.classList.add("dim");
  });
  const head = document.getElementById("fb-head");
  if(ok){
    score++; combo++; bestCombo=Math.max(bestCombo,combo);
    const gain = 10 + (combo>=3 ? 5 : 0);
    xpGain += gain; flyXP("+"+gain, ev);
    head.className="fb-head ok";
    head.textContent = ["BIEN JOUÉ !","EXCELLENT !","IMPARABLE !","PARFAIT !","TROP FORT !"][Math.floor(Math.random()*5)];
    const cb=document.getElementById("combo");
    if(combo>=2){ cb.textContent=`COMBO ×${combo} 🔥`; cb.classList.remove("boom"); void cb.offsetWidth; cb.classList.add("boom"); }
    vibrate(30);
  }else{
    combo=0; document.getElementById("combo").textContent="";
    mistakes.push(quiz.questions[qi]);
    head.className="fb-head ko"; head.textContent="PRESQUE…";
    vibrate([60,40,60]);
  }
  document.getElementById("xp-chip").textContent = "⚡ "+xpGain;
  document.getElementById("fb-text").textContent = q.explanation||"";
  document.getElementById("next").textContent = qi+1<quiz.questions.length ? "SUITE ➜" : "RÉSULTATS 🏆";
  document.getElementById("feedback").classList.add("on");
  const sq = document.getElementById("s-quiz");
  sq.classList.add("answered");
  requestAnimationFrame(()=>{ sq.style.paddingBottom = document.getElementById("feedback").offsetHeight + "px"; });
}
function nextQ(){ qi++; if(qi<quiz.questions.length) showQ(); else finish(); }
function flyXP(txt, ev){
  const el=document.createElement("div"); el.className="xp-fly"; el.textContent=txt;
  el.style.left=((ev?.clientX)||window.innerWidth/2)-20+"px"; el.style.top=((ev?.clientY)||200)-30+"px";
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch{} }
function quitQuiz(){ goHome(); }

function finish(){
  document.getElementById("progress").style.width="100%";
  const n = quiz.questions.length, pct = score/n;
  const stars = pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  if(stars===3) xpGain += 20;
  const titles = ["ENTRAÎNE-TOI !","PAS MAL !","BIEN JOUÉ !","VICTOIRE !"];
  document.getElementById("r-title").textContent = titles[stars];
  document.getElementById("m-result").innerHTML = stars>=2 ? mascot("happy", false, true) : mascot(stars>=1?"happy":"sad", true);
  document.getElementById("r-stars").innerHTML = [0,1,2].map(i=>`<span class="${i<stars?"":"off"}" style="animation-delay:${.2+i*.2}s">⭐</span>`).join("");
  document.getElementById("r-score").textContent = `${score} / ${n}`;
  document.getElementById("r-lesson").textContent = quiz.title || "";
  document.getElementById("r-xp").innerHTML = `<span class="chip">⚡ ${xpGain} XP</span> <span class="chip">🔥 combo max ×${bestCombo}</span>`;
  document.getElementById("r-miss-card").style.display = mistakes.length ? "block" : "none";
  document.getElementById("r-retry").style.display = mistakes.length ? "block" : "none";
  document.getElementById("r-miss").innerHTML = mistakes.map(q=>
    `<div class="miss"><div class="q">${esc(q.question)}</div><div class="a">✔ ${esc(q.choices[q.answer_index])}</div><div class="x">${esc(q.explanation)}</div></div>`).join("");
  go("result");
  if(stars>=2) confetti();
}
function retryMistakes(){ startQuiz({title:quiz.title+" (erreurs)", subject:quiz.subject, questions:mistakes}, true); }
function confetti(){
  const cols=["#ff4d5e","#ffd23f","#3ddc84","#2fa8ff","#ff5ec8","#ff8a1f"];
  for(let i=0;i<60;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=Math.random()*100+"vw"; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.8+Math.random()*1.8)+"s"; c.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(c); setTimeout(()=>c.remove(),4500);
  }
}
